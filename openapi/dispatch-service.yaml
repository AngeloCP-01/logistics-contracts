openapi: 3.1.0
info:
  title: Dispatch Service API
  version: 0.2.0
  description: Assignment aggregate — offer orders to drivers, accept/reject offers, admin force-assign, list available drivers.
servers:
  - url: /v1
paths:
  /dispatch/assignments/{orderId}:
    get:
      operationId: getAssignment
      summary: Get an assignment (admin or the assigned driver)
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: orderId, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Assignment' }
        '401': { $ref: 'common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'common.yaml#/components/responses/NotFound' }
  /dispatch/assignments/{orderId}/accept:
    post:
      operationId: acceptAssignment
      summary: Driver accepts the current offer
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: orderId, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Accepted }
        '401': { $ref: 'common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'common.yaml#/components/responses/NotFound' }
        '409': { $ref: 'common.yaml#/components/responses/Conflict' }
  /dispatch/assignments/{orderId}/reject:
    post:
      operationId: rejectAssignment
      summary: Driver rejects the current offer
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: orderId, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RejectOfferRequest' }
      responses:
        '204': { description: Rejected }
        '401': { $ref: 'common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'common.yaml#/components/responses/NotFound' }
        '409': { $ref: 'common.yaml#/components/responses/Conflict' }
  /dispatch/assignments/{orderId}/force-assign:
    post:
      operationId: forceAssign
      summary: Admin force-assigns a driver to an unassigned/parked/failed order
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: orderId, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ForceAssignRequest' }
      responses:
        '204': { description: Assigned }
        '401': { $ref: 'common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'common.yaml#/components/responses/NotFound' }
        '409': { $ref: 'common.yaml#/components/responses/Conflict' }
        '422': { $ref: 'common.yaml#/components/responses/UnprocessableEntity' }
  /dispatch/offers/current:
    get:
      operationId: getCurrentOffer
      summary: The calling driver's current outstanding offer (driver only)
      description: Returns the assignment currently offered to the authenticated driver, or 204 if none.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: The driver's current offer
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentOffer' }
        '204': { description: No outstanding offer for this driver }
        '401': { $ref: 'common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }
  /dispatch/drivers/available:
    get:
      operationId: listAvailableDrivers
      summary: List currently-available drivers (admin)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AvailableDriverPage' }
        '401': { $ref: 'common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }
  /healthz:
    get:
      operationId: healthz
      summary: Liveness probe
      security: []
      responses: { '200': { description: OK } }
  /readyz:
    get:
      operationId: readyz
      summary: Readiness probe (DB + RabbitMQ)
      security: []
      responses:
        '200': { description: OK }
        '503':
          description: Not ready
          content:
            application/problem+json:
              schema: { $ref: 'common.yaml#/components/schemas/ProblemDetails' }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  schemas:
    RejectOfferRequest:
      type: object
      properties:
        reason: { type: string, maxLength: 500 }
    ForceAssignRequest:
      type: object
      required: [driverId]
      properties:
        driverId: { type: string, format: uuid }
    Assignment:
      type: object
      required: [orderId, status, assignedDriverId, offerAttempts, order]
      properties:
        orderId: { type: string, format: uuid }
        status: { type: string, enum: [awaiting_driver, offered, assigned, completed, cancelled, failed] }
        assignedDriverId: { type: [string, 'null'], format: uuid }
        offerAttempts: { type: integer }
        order: { $ref: '#/components/schemas/OrderSummary' }
    AddressSnapshot:
      type: object
      required: [street, city, country, lat, lng]
      properties:
        label:   { type: string }
        street:  { type: string }
        city:    { type: string }
        country: { type: string, minLength: 2, maxLength: 2 }
        lat:     { type: number, minimum: -90, maximum: 90 }
        lng:     { type: number, minimum: -180, maximum: 180 }
    OrderItem:
      type: object
      required: [description, quantity, weightKg]
      properties:
        description: { type: string }
        quantity:    { type: integer, minimum: 1 }
        weightKg:    { type: [number, 'null'] }
    OrderSummary:
      type: object
      required: [pickup, dropoff, items]
      properties:
        pickup:  { $ref: '#/components/schemas/AddressSnapshot' }
        dropoff: { $ref: '#/components/schemas/AddressSnapshot' }
        items:
          type: array
          items: { $ref: '#/components/schemas/OrderItem' }
    CurrentOffer:
      type: object
      required: [orderId, offerAttempts, expiresAt, order]
      properties:
        orderId:       { type: string, format: uuid }
        offerAttempts: { type: integer }
        expiresAt:     { type: string, format: date-time }
        order:         { $ref: '#/components/schemas/OrderSummary' }
    AvailableDriver:
      type: object
      required: [driverId, displayName, vehicleType, availableSince]
      properties:
        driverId: { type: string, format: uuid }
        displayName: { type: string }
        vehicleType: { type: [string, 'null'] }
        availableSince: { type: string, format: date-time }
    AvailableDriverPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AvailableDriver' }
