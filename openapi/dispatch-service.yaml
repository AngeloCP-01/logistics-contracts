openapi: 3.1.0
info:
  title: Dispatch Service API
  version: 0.1.0
  description: Assignment aggregate — offer orders to drivers, accept/reject offers, admin force-assign, list available drivers.
servers:
  - url: /v1
paths:
  /dispatch/assignments/{orderId}:
    get:
      operationId: getAssignment
      summary: Get an assignment (admin or the assigned driver)
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: orderId, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Assignment' }
        '401': { $ref: 'common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'common.yaml#/components/responses/NotFound' }
  /dispatch/assignments/{orderId}/accept:
    post:
      operationId: acceptAssignment
      summary: Driver accepts the current offer
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: orderId, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Accepted }
        '401': { $ref: 'common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'common.yaml#/components/responses/NotFound' }
        '409': { $ref: 'common.yaml#/components/responses/Conflict' }
  /dispatch/assignments/{orderId}/reject:
    post:
      operationId: rejectAssignment
      summary: Driver rejects the current offer
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: orderId, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RejectOfferRequest' }
      responses:
        '204': { description: Rejected }
        '401': { $ref: 'common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'common.yaml#/components/responses/NotFound' }
        '409': { $ref: 'common.yaml#/components/responses/Conflict' }
  /dispatch/assignments/{orderId}/force-assign:
    post:
      operationId: forceAssign
      summary: Admin force-assigns a driver to an unassigned/parked/failed order
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: orderId, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ForceAssignRequest' }
      responses:
        '204': { description: Assigned }
        '401': { $ref: 'common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'common.yaml#/components/responses/NotFound' }
        '409': { $ref: 'common.yaml#/components/responses/Conflict' }
        '422': { $ref: 'common.yaml#/components/responses/UnprocessableEntity' }
  /dispatch/drivers/available:
    get:
      operationId: listAvailableDrivers
      summary: List currently-available drivers (admin)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AvailableDriverPage' }
        '401': { $ref: 'common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }
  /healthz:
    get:
      operationId: healthz
      summary: Liveness probe
      security: []
      responses: { '200': { description: OK } }
  /readyz:
    get:
      operationId: readyz
      summary: Readiness probe (DB + RabbitMQ)
      security: []
      responses:
        '200': { description: OK }
        '503':
          description: Not ready
          content:
            application/problem+json:
              schema: { $ref: 'common.yaml#/components/schemas/ProblemDetails' }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  schemas:
    RejectOfferRequest:
      type: object
      properties:
        reason: { type: string, maxLength: 500 }
    ForceAssignRequest:
      type: object
      required: [driverId]
      properties:
        driverId: { type: string, format: uuid }
    Assignment:
      type: object
      required: [orderId, status, assignedDriverId, offerAttempts]
      properties:
        orderId: { type: string, format: uuid }
        status: { type: string, enum: [awaiting_driver, offered, assigned, completed, cancelled, failed] }
        assignedDriverId: { type: [string, 'null'], format: uuid }
        offerAttempts: { type: integer }
    AvailableDriver:
      type: object
      required: [driverId, displayName, vehicleType, availableSince]
      properties:
        driverId: { type: string, format: uuid }
        displayName: { type: string }
        vehicleType: { type: [string, 'null'] }
        availableSince: { type: string, format: date-time }
    AvailableDriverPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AvailableDriver' }
