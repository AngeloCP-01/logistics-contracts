openapi: 3.1.0
info:
  title: Tracking Service API
  version: 0.6.0
  description: Real-time delivery tracking read surface (last-known position + breadcrumb). The live stream is over WebSocket (Socket.IO), documented separately in docs/tracking-ws.md.
servers:
  - url: https://api.example.com/v1
    description: Via the gateway (prepends /v1)
security:
  - bearerAuth: []
paths:
  /tracking/orders/{orderId}/latest:
    get:
      summary: Last-known position for an order (admin, the customer who owns it, or the assigned driver)
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/LocationPoint' } } } }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'common.yaml#/components/responses/NotFound' }
  /tracking/orders/{orderId}/route:
    get:
      summary: The persisted breadcrumb (oldest-first; cursor-paginated)
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: cursor, in: query, required: false, schema: { type: string } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 1000, default: 500 } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Route' } } } }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'common.yaml#/components/responses/NotFound' }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  schemas:
    LocationPoint:
      type: object
      required: [orderId, lat, lng, ts]
      properties:
        orderId: { type: string, format: uuid }
        lat: { type: number }
        lng: { type: number }
        ts: { type: string, format: date-time }
    Route:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/LocationPoint' } }
        nextCursor: { type: [string, 'null'] }
