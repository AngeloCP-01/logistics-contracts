openapi: 3.1.0
info:
  title: Order Service API
  version: 0.1.0
  description: Order aggregate — create deliveries, track lifecycle, cancel.
servers:
  - url: /v1
paths:
  /orders:
    post:
      operationId: createOrder
      summary: Create an order
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateOrderRequest' }
      responses:
        '201':
          description: Created
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '400': { $ref: 'common.yaml#/components/responses/ValidationFailed' }
        '401': { $ref: 'common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }
        '422': { $ref: 'common.yaml#/components/responses/UnprocessableEntity' }
    get:
      operationId: listOrders
      summary: List all orders (admin)
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: status, schema: { $ref: '#/components/schemas/OrderStatus' } }
        - { in: query, name: customerId, schema: { type: string, format: uuid } }
        - { in: query, name: cursor, schema: { type: string } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: Page of orders
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderPage' }
        '401': { $ref: 'common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }
  /orders/me:
    get:
      operationId: listMyOrders
      summary: List the caller's orders
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: status, schema: { $ref: '#/components/schemas/OrderStatus' } }
        - { in: query, name: cursor, schema: { type: string } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: Page of orders
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderPage' }
        '401': { $ref: 'common.yaml#/components/responses/Unauthorized' }
  /orders/{id}:
    get:
      operationId: getOrder
      summary: Get a single order (owner or admin)
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '401': { $ref: 'common.yaml#/components/responses/Unauthorized' }
        '404': { $ref: 'common.yaml#/components/responses/NotFound' }
  /orders/{id}/cancel:
    post:
      operationId: cancelOrder
      summary: Cancel an order
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CancelOrderRequest' }
      responses:
        '200':
          description: Cancelled order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '401': { $ref: 'common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: 'common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'common.yaml#/components/responses/NotFound' }
        '409': { $ref: 'common.yaml#/components/responses/Conflict' }
  /healthz:
    get:
      operationId: healthz
      summary: Liveness probe
      security: []
      responses: { '200': { description: OK } }
  /readyz:
    get:
      operationId: readyz
      summary: Readiness probe (DB + RabbitMQ)
      security: []
      responses:
        '200': { description: OK }
        '503':
          description: Not ready
          content:
            application/problem+json:
              schema: { $ref: 'common.yaml#/components/schemas/ProblemDetails' }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  schemas:
    OrderStatus:
      type: string
      enum: [created, assigned, in_transit, completed, cancelled]
    AddressInput:
      type: object
      required: [street, city, country, lat, lng]
      properties:
        label: { type: string }
        street: { type: string, minLength: 1 }
        city: { type: string, minLength: 1 }
        country: { type: string, minLength: 2, maxLength: 2 }
        lat: { type: number, minimum: -90, maximum: 90 }
        lng: { type: number, minimum: -180, maximum: 180 }
    AddressSnapshot:
      allOf: [{ $ref: '#/components/schemas/AddressInput' }]
    OrderItemInput:
      type: object
      required: [description, quantity]
      properties:
        description: { type: string, minLength: 1 }
        quantity: { type: integer, minimum: 1 }
        weightKg: { type: number, exclusiveMinimum: 0 }
    CreateOrderRequest:
      type: object
      required: [pickup, dropoffAddressId, items]
      properties:
        pickup: { $ref: '#/components/schemas/AddressInput' }
        dropoffAddressId: { type: string, format: uuid }
        items:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/OrderItemInput' }
        scheduledFor: { type: string, format: date-time }
    CancelOrderRequest:
      type: object
      properties:
        reason: { type: string }
    Order:
      type: object
      required: [id, customerId, status, pickup, dropoff, items, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        customerId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/OrderStatus' }
        pickup: { $ref: '#/components/schemas/AddressSnapshot' }
        dropoff: { $ref: '#/components/schemas/AddressSnapshot' }
        items:
          type: array
          items: { $ref: '#/components/schemas/OrderItemInput' }
        assignedDriverId: { type: [string, 'null'], format: uuid }
        scheduledFor: { type: [string, 'null'], format: date-time }
        cancelReason: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    OrderPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Order' }
        nextCursor: { type: [string, 'null'] }
