asyncapi: 3.0.0
info:
  title: Logistics Platform Events
  version: 0.5.0
  description: |
    All async events flowing through the logistics.events RabbitMQ topic exchange.
    v0.3.0 adds driver.availability.changed (user-service).
    v0.5.0 adds dispatch.assignment.failed (dispatch-service) + the dispatch-service consumer of delivery.completed.

servers:
  rabbitmq:
    host: '{{ RABBITMQ_HOST }}'
    protocol: amqp
    description: RabbitMQ broker (CloudAMQP in prod, local container in dev)

channels:
  userRegistered:
    address: 'user.registered'
    description: Published by auth-service when a user finishes registration.
    messages:
      UserRegistered:
        $ref: '#/components/messages/UserRegistered'

  userEmailVerificationRequested:
    address: 'user.email_verification_requested'
    description: Published by auth-service at registration and on /verify-email/resend.
    messages:
      UserEmailVerificationRequested:
        $ref: '#/components/messages/UserEmailVerificationRequested'

  userEmailVerified:
    address: 'user.email_verified'
    description: Published by auth-service when a user completes email verification.
    messages:
      UserEmailVerified:
        $ref: '#/components/messages/UserEmailVerified'

  userPasswordResetRequested:
    address: 'user.password_reset_requested'
    description: Published by auth-service when a password-reset is requested for an existing account.
    messages:
      UserPasswordResetRequested:
        $ref: '#/components/messages/UserPasswordResetRequested'

  userPasswordChanged:
    address: 'user.password_changed'
    description: Published by auth-service on successful password reset confirmation.
    messages:
      UserPasswordChanged:
        $ref: '#/components/messages/UserPasswordChanged'

  userRoleChanged:
    address: 'user.role_changed'
    description: Published by auth-service when an admin changes a user's role (and the role actually changed).
    messages:
      UserRoleChanged:
        $ref: '#/components/messages/UserRoleChanged'

  driverAvailabilityChanged:
    address: 'driver.availability.changed'
    description: Published by user-service when a driver toggles their availability. Also emitted by user-service on role-change cleanup when a previously-available driver is demoted.
    messages:
      DriverAvailabilityChanged:
        $ref: '#/components/messages/DriverAvailabilityChanged'

  orderCreated:
    address: 'order.created'
    description: Published by order-service when a new order is created.
    messages:
      OrderCreated:
        $ref: '#/components/messages/OrderCreated'

  orderStatusChanged:
    address: 'order.status.changed'
    description: Published by order-service when an order transitions between statuses.
    messages:
      OrderStatusChanged:
        $ref: '#/components/messages/OrderStatusChanged'

  orderCancelled:
    address: 'order.cancelled'
    description: Published by order-service when an order is cancelled.
    messages:
      OrderCancelled:
        $ref: '#/components/messages/OrderCancelled'

  dispatchDriverAssigned:
    address: 'dispatch.driver.assigned'
    description: Consumed by order-service. Produced by dispatch-service (later phase) when a driver is assigned to an order.
    messages:
      DispatchDriverAssigned:
        $ref: '#/components/messages/DispatchDriverAssigned'

  dispatchAssignmentFailed:
    address: 'dispatch.assignment.failed'
    description: Published by dispatch-service when all driver offers for an order are rejected and no driver could be assigned.
    messages:
      DispatchAssignmentFailed:
        $ref: '#/components/messages/DispatchAssignmentFailed'

  deliveryInTransit:
    address: 'delivery.in_transit'
    description: Consumed by order-service. Produced by dispatch/tracking (later phase) when a delivery goes in transit.
    messages:
      DeliveryInTransit:
        $ref: '#/components/messages/DeliveryInTransit'

  deliveryCompleted:
    address: 'delivery.completed'
    description: Consumed by order-service. Produced by dispatch/tracking (later phase) when a delivery is completed.
    messages:
      DeliveryCompleted:
        $ref: '#/components/messages/DeliveryCompleted'

operations:
  publishUserRegistered:
    action: send
    channel: { $ref: '#/channels/userRegistered' }
  publishUserEmailVerificationRequested:
    action: send
    channel: { $ref: '#/channels/userEmailVerificationRequested' }
  publishUserEmailVerified:
    action: send
    channel: { $ref: '#/channels/userEmailVerified' }
  publishUserPasswordResetRequested:
    action: send
    channel: { $ref: '#/channels/userPasswordResetRequested' }
  publishUserPasswordChanged:
    action: send
    channel: { $ref: '#/channels/userPasswordChanged' }
  publishUserRoleChanged:
    action: send
    channel: { $ref: '#/channels/userRoleChanged' }
  publishDriverAvailabilityChanged:
    action: send
    channel: { $ref: '#/channels/driverAvailabilityChanged' }
  publishOrderCreated:
    action: send
    channel: { $ref: '#/channels/orderCreated' }
  publishOrderStatusChanged:
    action: send
    channel: { $ref: '#/channels/orderStatusChanged' }
  publishOrderCancelled:
    action: send
    channel: { $ref: '#/channels/orderCancelled' }
  receiveDispatchDriverAssigned:
    action: receive
    channel: { $ref: '#/channels/dispatchDriverAssigned' }
  publishDispatchAssignmentFailed:
    action: send
    channel: { $ref: '#/channels/dispatchAssignmentFailed' }
  receiveDeliveryInTransit:
    action: receive
    channel: { $ref: '#/channels/deliveryInTransit' }
  receiveDeliveryCompleted:
    action: receive
    channel: { $ref: '#/channels/deliveryCompleted' }

components:
  messages:
    UserRegistered:
      name: UserRegistered
      title: User Registered
      contentType: application/json
      payload:
        type: object
        required: [eventId, eventType, eventVersion, occurredAt, correlationId, producer, data]
        allOf:
          - $ref: '../schemas/event-envelope.json'
        properties:
          eventType: { const: user.registered }
          data:
            type: object
            required: [userId, email, role]
            properties:
              userId: { type: string, format: uuid }
              email: { type: string, format: email }
              role: { type: string, enum: [customer, driver] }
            additionalProperties: false

    UserEmailVerificationRequested:
      name: UserEmailVerificationRequested
      title: User Email Verification Requested
      contentType: application/json
      payload:
        type: object
        required: [eventId, eventType, eventVersion, occurredAt, correlationId, producer, data]
        allOf:
          - $ref: '../schemas/event-envelope.json'
        properties:
          eventType: { const: user.email_verification_requested }
          data:
            type: object
            required: [userId, email, verificationToken, expiresAt]
            properties:
              userId: { type: string, format: uuid }
              email: { type: string, format: email }
              verificationToken: { type: string, minLength: 32 }
              expiresAt: { type: string, format: date-time }
            additionalProperties: false

    UserEmailVerified:
      name: UserEmailVerified
      title: User Email Verified
      contentType: application/json
      payload:
        type: object
        required: [eventId, eventType, eventVersion, occurredAt, correlationId, producer, data]
        allOf:
          - $ref: '../schemas/event-envelope.json'
        properties:
          eventType: { const: user.email_verified }
          data:
            type: object
            required: [userId, email, verifiedAt]
            properties:
              userId: { type: string, format: uuid }
              email: { type: string, format: email }
              verifiedAt: { type: string, format: date-time }
            additionalProperties: false

    UserPasswordResetRequested:
      name: UserPasswordResetRequested
      title: User Password Reset Requested
      contentType: application/json
      payload:
        type: object
        required: [eventId, eventType, eventVersion, occurredAt, correlationId, producer, data]
        allOf:
          - $ref: '../schemas/event-envelope.json'
        properties:
          eventType: { const: user.password_reset_requested }
          data:
            type: object
            required: [userId, email, resetToken, expiresAt]
            properties:
              userId: { type: string, format: uuid }
              email: { type: string, format: email }
              resetToken: { type: string, minLength: 32 }
              expiresAt: { type: string, format: date-time }
            additionalProperties: false

    UserPasswordChanged:
      name: UserPasswordChanged
      title: User Password Changed
      contentType: application/json
      payload:
        type: object
        required: [eventId, eventType, eventVersion, occurredAt, correlationId, producer, data]
        allOf:
          - $ref: '../schemas/event-envelope.json'
        properties:
          eventType: { const: user.password_changed }
          data:
            type: object
            required: [userId, email, changedAt]
            properties:
              userId: { type: string, format: uuid }
              email: { type: string, format: email }
              changedAt: { type: string, format: date-time }
            additionalProperties: false

    UserRoleChanged:
      name: UserRoleChanged
      title: User Role Changed
      contentType: application/json
      payload:
        type: object
        required: [eventId, eventType, eventVersion, occurredAt, correlationId, producer, data]
        allOf:
          - $ref: '../schemas/event-envelope.json'
        properties:
          eventType: { const: user.role_changed }
          data:
            type: object
            required: [userId, oldRole, newRole, changedBy, changedAt]
            properties:
              userId: { type: string, format: uuid }
              oldRole: { type: string, enum: [customer, driver, admin] }
              newRole: { type: string, enum: [customer, driver, admin] }
              changedBy: { type: string, format: uuid }
              changedAt: { type: string, format: date-time }
            additionalProperties: false

    DriverAvailabilityChanged:
      name: DriverAvailabilityChanged
      title: Driver Availability Changed
      contentType: application/json
      payload:
        type: object
        required: [eventId, eventType, eventVersion, occurredAt, correlationId, producer, data]
        allOf:
          - $ref: '../schemas/event-envelope.json'
        properties:
          eventType: { const: driver.availability.changed }
          data:
            type: object
            required: [userId, isAvailable, changedAt]
            properties:
              userId: { type: string, format: uuid }
              isAvailable: { type: boolean }
              changedAt: { type: string, format: date-time }
            additionalProperties: false

    OrderCreated:
      name: OrderCreated
      title: Order Created
      contentType: application/json
      payload:
        type: object
        required: [eventId, eventType, eventVersion, occurredAt, correlationId, producer, data]
        allOf:
          - $ref: '../schemas/event-envelope.json'
        properties:
          eventType: { const: order.created }
          producer: { const: order-service }
          data:
            type: object
            required: [orderId, customerId, pickup, dropoff, items]
            properties:
              orderId: { type: string, format: uuid }
              customerId: { type: string, format: uuid }
              pickup: { $ref: '#/components/schemas/AddressSnapshot' }
              dropoff: { $ref: '#/components/schemas/AddressSnapshot' }
              items:
                type: array
                items: { $ref: '#/components/schemas/OrderItemPayload' }
              scheduledFor: { type: [string, 'null'], format: date-time }
            additionalProperties: false

    OrderStatusChanged:
      name: OrderStatusChanged
      title: Order Status Changed
      contentType: application/json
      payload:
        type: object
        required: [eventId, eventType, eventVersion, occurredAt, correlationId, producer, data]
        allOf:
          - $ref: '../schemas/event-envelope.json'
        properties:
          eventType: { const: order.status.changed }
          producer: { const: order-service }
          data:
            type: object
            required: [orderId, fromStatus, toStatus, changedBy]
            properties:
              orderId: { type: string, format: uuid }
              fromStatus: { type: [string, 'null'], enum: [created, assigned, in_transit, completed, cancelled, null] }
              toStatus: { type: string, enum: [created, assigned, in_transit, completed, cancelled] }
              changedBy: { type: string }
            additionalProperties: false

    OrderCancelled:
      name: OrderCancelled
      title: Order Cancelled
      contentType: application/json
      payload:
        type: object
        required: [eventId, eventType, eventVersion, occurredAt, correlationId, producer, data]
        allOf:
          - $ref: '../schemas/event-envelope.json'
        properties:
          eventType: { const: order.cancelled }
          producer: { const: order-service }
          data:
            type: object
            required: [orderId, customerId, previousStatus, reason]
            properties:
              orderId: { type: string, format: uuid }
              customerId: { type: string, format: uuid }
              previousStatus: { type: string, enum: [created, assigned, in_transit] }
              reason: { type: [string, 'null'] }
            additionalProperties: false

    DispatchDriverAssigned:
      name: DispatchDriverAssigned
      title: Dispatch Driver Assigned
      contentType: application/json
      payload:
        type: object
        required: [eventId, eventType, eventVersion, occurredAt, correlationId, producer, data]
        allOf:
          - $ref: '../schemas/event-envelope.json'
        properties:
          eventType: { const: dispatch.driver.assigned }
          data:
            type: object
            required: [orderId, driverId]
            properties:
              orderId: { type: string, format: uuid }
              driverId: { type: string, format: uuid }
            additionalProperties: false

    DispatchAssignmentFailed:
      name: DispatchAssignmentFailed
      title: Dispatch Assignment Failed
      contentType: application/json
      payload:
        type: object
        required: [eventId, eventType, eventVersion, occurredAt, correlationId, producer, data]
        allOf:
          - $ref: '../schemas/event-envelope.json'
        properties:
          eventType: { const: dispatch.assignment.failed }
          producer: { const: dispatch-service }
          data:
            type: object
            required: [orderId, reason]
            properties:
              orderId: { type: string, format: uuid }
              reason: { type: string, enum: [all_offers_rejected] }
            additionalProperties: false

    DeliveryInTransit:
      name: DeliveryInTransit
      title: Delivery In Transit
      contentType: application/json
      payload:
        type: object
        required: [eventId, eventType, eventVersion, occurredAt, correlationId, producer, data]
        allOf:
          - $ref: '../schemas/event-envelope.json'
        properties:
          eventType: { const: delivery.in_transit }
          data:
            type: object
            required: [orderId]
            properties:
              orderId: { type: string, format: uuid }
            additionalProperties: false

    DeliveryCompleted:
      name: DeliveryCompleted
      title: Delivery Completed
      contentType: application/json
      payload:
        type: object
        required: [eventId, eventType, eventVersion, occurredAt, correlationId, producer, data]
        allOf:
          - $ref: '../schemas/event-envelope.json'
        properties:
          eventType: { const: delivery.completed }
          data:
            type: object
            required: [orderId]
            properties:
              orderId: { type: string, format: uuid }
            additionalProperties: false

  schemas:
    AddressSnapshot:
      type: object
      required: [street, city, country, lat, lng]
      properties:
        label: { type: string }
        street: { type: string }
        city: { type: string }
        country: { type: string, minLength: 2, maxLength: 2 }
        lat: { type: number, minimum: -90, maximum: 90 }
        lng: { type: number, minimum: -180, maximum: 180 }
    OrderItemPayload:
      type: object
      required: [description, quantity]
      properties:
        description: { type: string }
        quantity: { type: integer, minimum: 1 }
        weightKg: { type: [number, 'null'], exclusiveMinimum: 0 }
